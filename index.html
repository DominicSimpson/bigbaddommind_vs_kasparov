<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DomDeepBlue Chess App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    name="description"
    content="A browser-based chess app powered by the DomDeepBlue engine."
  />
  <link rel="icon" href="favicon.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <p class="eyebrow">Chess Engine Playground</p>
      <h1>DomDeepBlue</h1>
      <p class="intro">
        The engine is already running. This first page gives it a visible board,
        status area, and room for controls next.
      </p>
    </section>

    <section class="board-panel" aria-label="Chess board panel">
      <div class="panel-header">
        <div>
          <h2>Board</h2>
          <p id="status" class="status-text">Loading position...</p>
        </div>
        <div id="turn-badge" class="turn-badge" aria-live="polite"></div>
      </div>

      <div id="chessboard" class="board-frame" aria-label="Chess board"></div>
    </section>
  </main>

  <script type="module" src="/src/index.ts"></script>
</body>
</html>
