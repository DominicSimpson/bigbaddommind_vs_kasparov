<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DomDeepBlue Chess App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    name="description"
    content="A browser-based chess app powered by the DomDeepBlue engine."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Michroma&family=Wallpoet&display=swap"
    rel="stylesheet"
  />
  <link rel="icon" href="favicon.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="app-header">
      <img src="/logo/domdeepblue_logo.png" alt="DomDeepBlue Logo" class="logo" />
    </section>

    <section class="board-panel" aria-label="Chess board panel">
      <div class="board-layout">
        <section id="captured-pieces" class="captured-panel captured-panel--left" aria-live="polite"></section>
        <div class="board-column">
          <p id="status" class="status-text"></p>
          <div id="chessboard" class="board-frame" aria-label="Chess board"></div>
        </div>
        <div class="panel-sidebar">
          <div id="turn-badge" class="turn-badge" aria-live="polite"></div>
          <div class="control-panel" aria-label="Game controls">
            <div class="control-panel__controls">
              <div class="control-panel__control">
                <span class="control-panel__label" aria-hidden="true">New Game</span>
              </div>
              <div class="control-panel__control">
                <span class="control-panel__label" aria-hidden="true">Undo Move</span>
              </div>
              <div class="control-panel__control">
                <span class="control-panel__label" aria-hidden="true">Exit Game</span>
              </div>
              <div class="control-panel__control">
                <span class="control-panel__label" aria-hidden="true">Game Info</span>
              </div>
            </div>
            <div class="control-panel__trough">
              <div class="control-panel__button-slot">
                <button id="new-game-button" type="button" class="control-panel__button" aria-label="New Game"></button>
              </div>
              <div class="control-panel__button-slot">
                <button id="undo-move-button" type="button" class="control-panel__button" aria-label="Undo the last move"></button>
              </div>
              <div class="control-panel__button-slot">
                <button id="exit-game-button" type="button" class="control-panel__button" aria-label="Exit the current game"></button>
              </div>
              <div class="control-panel__button-slot">
                <button type="button" class="control-panel__button" aria-label="View game information"></button>
              </div>
            </div>
          </div>
          <form
            id="move-entry-form"
            class="move-entry-panel"
            aria-label="Accessible move entry"
          >
            <div class="move-entry-panel__readouts">
              <div class="move-entry-panel__readout">
                <label class="move-entry-panel__label" for="move-from-input">From</label>
                <span class="move-entry-panel__display-well">
                  <span class="move-entry-panel__stepper">
                    <button
                      id="move-from-increment-button"
                      class="move-entry-panel__stepper-button"
                      type="button"
                      aria-label="Select the next starting square"
                    >
                      +
                    </button>
                    <button
                      id="move-from-decrement-button"
                      class="move-entry-panel__stepper-button"
                      type="button"
                      aria-label="Select the previous starting square"
                    >
                      -
                    </button>
                  </span>
                  <input
                    id="move-from-input"
                    class="move-entry-panel__input"
                    type="text"
                    inputmode="text"
                    autocomplete="off"
                    autocapitalize="characters"
                    spellcheck="false"
                    maxlength="2"
                    placeholder="A2"
                    aria-label="Enter the piece starting square"
                  />
                </span>
              </div>
              <div class="move-entry-panel__readout">
                <label class="move-entry-panel__label" for="move-to-input">To</label>
                <span class="move-entry-panel__display-well">
                  <span class="move-entry-panel__stepper">
                    <button
                      id="move-to-increment-button"
                      class="move-entry-panel__stepper-button"
                      type="button"
                      aria-label="Select the next destination square"
                    >
                      +
                    </button>
                    <button
                      id="move-to-decrement-button"
                      class="move-entry-panel__stepper-button"
                      type="button"
                      aria-label="Select the previous destination square"
                    >
                      -
                    </button>
                  </span>
                  <input
                    id="move-to-input"
                    class="move-entry-panel__input"
                    type="text"
                    inputmode="text"
                    autocomplete="off"
                    autocapitalize="characters"
                    spellcheck="false"
                    maxlength="2"
                    placeholder="A4"
                    aria-label="Enter the piece destination square"
                  />
                </span>
              </div>
            </div>
            <button
              id="move-entry-submit-button"
              class="move-entry-panel__submit"
              type="submit"
            >
              Enter Move
            </button>
            <section
              id="promotion-choice-panel"
              class="move-entry-panel__promotion"
              aria-label="Manual promotion choices"
              aria-disabled="true"
            >
              <p id="promotion-choice-status" class="move-entry-panel__promotion-status">
                Promotion pending. Choose the piece to confirm the move.
              </p>
              <div class="move-entry-panel__promotion-grid" role="group" aria-labelledby="promotion-choice-status">
                <div class="move-entry-panel__promotion-control">
                  <span class="move-entry-panel__promotion-name">Queen</span>
                  <button
                    type="button"
                    class="move-entry-panel__promotion-button"
                    data-promotion-piece="queen"
                    aria-label="Promote to queen"
                    disabled
                  >
                    <span class="move-entry-panel__promotion-symbol" aria-hidden="true"></span>
                  </button>
                </div>
                <div class="move-entry-panel__promotion-control">
                  <span class="move-entry-panel__promotion-name">Rook</span>
                  <button
                    type="button"
                    class="move-entry-panel__promotion-button"
                    data-promotion-piece="rook"
                    aria-label="Promote to rook"
                    disabled
                  >
                    <span class="move-entry-panel__promotion-symbol" aria-hidden="true"></span>
                  </button>
                </div>
                <div class="move-entry-panel__promotion-control">
                  <span class="move-entry-panel__promotion-name">Bishop</span>
                  <button
                    type="button"
                    class="move-entry-panel__promotion-button"
                    data-promotion-piece="bishop"
                    aria-label="Promote to bishop"
                    disabled
                  >
                    <span class="move-entry-panel__promotion-symbol" aria-hidden="true"></span>
                  </button>
                </div>
                <div class="move-entry-panel__promotion-control">
                  <span class="move-entry-panel__promotion-name">Knight</span>
                  <button
                    type="button"
                    class="move-entry-panel__promotion-button"
                    data-promotion-piece="knight"
                    aria-label="Promote to knight"
                    disabled
                  >
                    <span class="move-entry-panel__promotion-symbol" aria-hidden="true"></span>
                  </button>
                </div>
              </div>
            </section>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/src/index.ts"></script>
</body>
</html>
