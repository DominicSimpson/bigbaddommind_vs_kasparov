<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DomDeepBlue Chess App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    name="description"
    content="A browser-based chess app powered by the DomDeepBlue engine."
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Michroma&display=swap"
    rel="stylesheet"
  />
  <link rel="icon" href="favicon.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="app-header">
      <img src="/logo/domdeepblue_logo.png" alt="DomDeepBlue Logo" class="logo" />
    </section>

    <section class="board-panel" aria-label="Chess board panel">
      <div class="board-layout">
        <section id="captured-pieces" class="captured-panel captured-panel--left" aria-live="polite"></section>
        <div class="board-column">
          <p id="status" class="status-text"></p>
          <div id="chessboard" class="board-frame" aria-label="Chess board"></div>
        </div>
        <div class="panel-sidebar">
          <div id="turn-badge" class="turn-badge" aria-live="polite"></div>
          <div class="control-panel" aria-label="Game controls">
            <div class="control-panel__labels" aria-hidden="true">
              <span class="control-panel__label">New Game</span>
              <span class="control-panel__label">Undo Move</span>
              <span class="control-panel__label">Exit Game</span>
              <span class="control-panel__label">Game Info</span>
            </div>
            <div class="control-panel__trough">
              <button type="button" class="control-panel__button" aria-label="New Game"></button>
              <button type="button" class="control-panel__button" aria-label="Undo the last move"></button>
              <button type="button" class="control-panel__button" aria-label="Exit the current game"></button>
              <button type="button" class="control-panel__button" aria-label="View game information"></button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/src/index.ts"></script>
</body>
</html>
